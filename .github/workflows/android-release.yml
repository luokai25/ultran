name: Android Release

# The APK is built here and nowhere else. A sandbox build is not reproducible and
# leaves no audit trail; this workflow is the single source of truth for the
# Ultron Android release.

on:
  push:
    branches: [main]
    paths:
      - "apps/phone/**"
      - ".github/workflows/android-release.yml"
      # A root dependency change alters what the APK is built against, so it must
      # rebuild the release too. Without this, a rollup pin or a workspace bump
      # silently leaves the published APK stale.
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name to stamp on the APK (defaults to apps/phone/package.json)"
        required: false
        type: string

concurrency:
  # Only the newest main build should publish; stale emulator smoke tests must not block fixes.
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "20.11"
  PNPM_VERSION: "9.12.0"
  JAVA_VERSION: "17"
  WORKDIR: apps/phone

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No lockfile is committed yet, so resolution is unpinned and a transient
      # registry 404 on a freshly published tarball can fail the whole release.
      # Retry the install rather than treating a CDN miss as a build failure.
      - name: Install workspace
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm install --no-frozen-lockfile --fetch-retries=5 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "::warning::pnpm install failed (attempt $attempt of 3), retrying in 20s"
            sleep 20
          done
          echo "::error::pnpm install failed after 3 attempts"
          exit 1

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./${{ env.WORKDIR }}/package.json').version")
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="$PKG_VERSION"; fi
          # versionCode must increase monotonically for Android to accept an update.
          VERSION_CODE=$(( 1000 + ${{ github.run_number }} ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=android-v${VERSION}-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (code $VERSION_CODE)"

      - name: Build connector SDK
        run: pnpm --filter @ultron/connectors build

      - name: Build web assets
        working-directory: ${{ env.WORKDIR }}
        run: pnpm build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Gradle is installed by the action rather than through a committed
      # gradle-wrapper.jar: the wrapper jar is a 63 KB binary, and the repository
      # deliberately carries no opaque binaries. The version is pinned here and
      # must stay in step with the AGP version in android/build.gradle (AGP 8.2.1
      # requires Gradle 8.2+).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      # `packages` must be explicit. The action's default is
      # "tools platform-tools", and the legacy `tools` package no longer exists
      # in Google's SDK repository - sdkmanager exits 1 with "Failed to find
      # package 'tools'" and the whole job dies before Gradle ever runs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Sync Capacitor
        working-directory: ${{ env.WORKDIR }}
        run: npx cap sync android

      # The launcher icons and splash screens are generated, not committed, so
      # the repository carries no opaque binaries. Regenerate them before Gradle
      # resolves resources.
      - name: Generate Android assets
        working-directory: ${{ env.WORKDIR }}/android
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tools/generate_assets.py

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the APK will be UNSIGNED."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: ${{ env.WORKDIR }}/android
        env:
          APP_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ULTRON_VERSION_NAME: ${{ steps.version.outputs.name }}
          ULTRON_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          gradle assembleRelease --no-daemon --console=plain --stacktrace --max-workers=2 2>&1 | tee build.log

      - name: Verify privacy-safe merged Android manifest
        working-directory: ${{ env.WORKDIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=$(find app/build/intermediates -type f -path '*merged_manifest*release*/AndroidManifest.xml' -print -quit)
          if [ -z "$MANIFEST" ]; then
            echo "::error::Merged release manifest was not found"
            exit 1
          fi
          echo "Auditing $MANIFEST"
          if grep -E 'android.permission.(READ_SMS|RECEIVE_SMS|SEND_SMS|WRITE_SMS|READ_CALL_LOG|WRITE_CALL_LOG|PROCESS_OUTGOING_CALLS|MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)|BIND_ACCESSIBILITY_SERVICE|AccessibilityService' "$MANIFEST"; then
            echo "::error::Restricted or broad user-data access found in merged release manifest"
            exit 1
          fi
          echo "::notice::No restricted SMS/call-log, broad storage/media, battery-exemption, or accessibility-service declarations found"

      - name: Verify APK
        id: verify
        working-directory: ${{ env.WORKDIR }}/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::release APK was not produced"
            exit 1
          fi

          # Discover build-tools newest-first rather than hardcoding a version.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"

          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
            echo "::error::Refusing to publish an unsigned Android release"
            exit 1
          fi
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "::notice::APK signature verified"

          # Android's package installer expects a correctly aligned, intact APK.
          "$BT/zipalign" -c -v 4 "$APK"
          unzip -t "$APK" >/dev/null
          "$BT/aapt2" dump badging "$APK" | head -20

          # Fail the release if Gradle silently omits the native inference
          # runtime or one of its shared llama.cpp libraries for either ABI.
          for ABI in arm64-v8a x86_64; do
            unzip -l "$APK" | grep -q "lib/$ABI/libultron-llama.so"
            unzip -l "$APK" | grep -q "lib/$ABI/libllama.so"
            unzip -l "$APK" | grep -q "lib/$ABI/libmtmd.so"
          done

          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK is implausibly small ($SIZE bytes) - the web assets are probably missing"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/ultron-release.apk"
          cp "$APK" "$RUNNER_TEMP/out/ultron-${{ steps.version.outputs.name }}.apk"
          test -s "$RUNNER_TEMP/ultron-release.apk"
          test -s "$RUNNER_TEMP/out/ultron-${{ steps.version.outputs.name }}.apk"
          sha256sum "$RUNNER_TEMP/ultron-release.apk"
          echo "apk=$RUNNER_TEMP/ultron-release.apk" >> "$GITHUB_OUTPUT"
          echo "Verified APK copied to runner temp: $RUNNER_TEMP/ultron-release.apk"

      # A successful Gradle build and signature check do not prove that
      # PackageManager can parse/install the APK. Test the exact release file
      # on an Android 12 emulator before publishing it.
      - name: Install Android emulator image
        run: |
          set -euo pipefail
          sdkmanager --install "emulator" "system-images;android-31;google_apis;x86_64"
          yes | sdkmanager --licenses > /dev/null || true

      # GitHub-hosted Linux runners expose /dev/kvm but may leave it owned by
      # the kvm group without granting the runner user membership. The Android
      # x86_64 emulator requires KVM; grant access explicitly before launching it.
      - name: Enable KVM access for Android emulator
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; an x86_64 emulator cannot run here"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      # Run the emulator directly instead of delegating its lifecycle to a
      # composite action. Explicit boot and command timeouts ensure a stalled
      # emulator cannot leave the release job waiting indefinitely.
      - name: Android 12 install and launch smoke test
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/ultron-release.apk"
          AVD_NAME="ultron-api31"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          # setup-android may export an alternate AVD home. Pin both the
          # creator and emulator to the same standard directory.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -s "$APK"
          echo "Testing APK SHA-256:"
          sha256sum "$APK"

          echo "no" | avdmanager create avd --force --name "$AVD_NAME" \
            --package "system-images;android-31;google_apis;x86_64" --device "pixel_6"
          echo "Created AVD definitions:"
          avdmanager list avd
          echo "Emulator-visible AVDs:"
          "$EMULATOR" -list-avds
          test -s "$ANDROID_AVD_HOME/$AVD_NAME.ini"

          adb start-server
          "$EMULATOR" -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -wipe-data \
            -verbose > "$RUNNER_TEMP/ultron-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if ! timeout 600 adb wait-for-device; then
            echo "::error::Android emulator did not expose an adb device within 10 minutes"
            echo "Emulator process:"
            ps -fp "$EMULATOR_PID" || true
            echo "ADB devices:"
            adb devices -l || true
            echo "Emulator log (last 250 lines):"
            tail -250 "$RUNNER_TEMP/ultron-emulator.log" || true
            exit 1
          fi
          BOOTED=false
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              BOOTED=true
              break
            fi
            sleep 5
          done
          if [ "$BOOTED" != "true" ]; then
            echo "::error::Android 12 emulator did not finish booting"
            tail -200 "$RUNNER_TEMP/ultron-emulator.log" || true
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r "$APK"
          adb shell monkey -p app.ultron.mobile 1
          sleep 5
          adb shell dumpsys package app.ultron.mobile | grep -Fq "versionName=${{ steps.version.outputs.name }}"
          echo "Android 12 PackageManager installed Ultron and launch intent completed"

      - name: Package Capacitor project
        run: |
          set -euo pipefail
          cd "${{ env.WORKDIR }}"
          # Ship the native project so the APK can be rebuilt from the release
          # alone, without cloning and re-running cap add.
          zip -r "$RUNNER_TEMP/out/ultron-capacitor-android-${{ steps.version.outputs.name }}.zip" \
            android \
            capacitor.config.ts \
            package.json \
            -x "android/.gradle/*" \
            -x "android/build/*" \
            -x "android/app/build/*" \
            -x "android/app/.cxx/*" \
            -x "android/app/.externalNativeBuild/*" \
            -x "android/local.properties" \
            -x "android/app/src/main/assets/public/*" \
            -x "android/*.keystore" \
            -x "android/keystore.properties"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ultron Android ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Signed Android release built by CI from `${{ github.sha }}`.

            | | |
            | --- | --- |
            | Version | `${{ steps.version.outputs.name }}` |
            | versionCode | `${{ steps.version.outputs.code }}` |
            | Package | `app.ultron.mobile` |
            | Signed | `${{ steps.keystore.outputs.signed }}` |
            | Commit | `${{ github.sha }}` |

            **Assets**

            - `ultron-${{ steps.version.outputs.name }}.apk` - installable release APK
            - `ultron-capacitor-android-${{ steps.version.outputs.name }}.zip` - the full
              Capacitor Android project, so the APK can be rebuilt from this release alone

            Install with `adb install -r ultron-${{ steps.version.outputs.name }}.apk`.
          files: |
            ${{ runner.temp }}/out/ultron-${{ steps.version.outputs.name }}.apk
            ${{ runner.temp }}/out/ultron-capacitor-android-${{ steps.version.outputs.name }}.zip

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ env.WORKDIR }}/android/build.log
          if-no-files-found: ignore

      - name: Remove keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" || true
