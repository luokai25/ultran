name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The Python backend is a first-class part of this monorepo and carries the
  # deploy planner, tool sandbox, forge diagnostics, billing ledger and the MCP
  # connector runtime. It used to be skipped entirely, which is how a missing
  # module and a schema regression both reached main unnoticed.
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ultran-backend/pyproject.toml

      - name: Install
        working-directory: ultran-backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio httpx

      - name: Import check
        working-directory: ultran-backend
        run: python -c "import ultran_backend; import ultran_backend.mcp; print('import ok')"

      - name: Test
        working-directory: ultran-backend
        run: python -m pytest -q

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11

      # Frozen once the lockfile exists: resolving the tree on every run is what
      # let a stale registry edge fail two release builds in a row. The fallback
      # keeps the very first run on a branch without a lockfile working.
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::no lockfile on this ref - resolving unpinned"
            pnpm install --no-frozen-lockfile
          fi

      - name: Commit generated pnpm lockfile
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ ! -f pnpm-lock.yaml ] || git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "No new lockfile to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: generate pnpm lockfile from workspace manifests"
          if ! git push origin HEAD:main; then
            echo "::warning::main advanced during CI; lockfile will be generated on a later run"
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  structure:
    name: Guard monorepo structure
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The layer boundaries are load-bearing. Fail fast if a top-level
      # workspace directory disappears or is renamed.
      - name: Required directories exist
        run: |
          set -euo pipefail
          required=(
            apps/mobile
            apps/web
            services/api
            services/agent-core
            packages/connectors
            packages/ui
            infra
            docs
          )
          for dir in "${required[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::missing required directory: $dir"
              exit 1
            fi
          done
          echo "all required directories present"

      - name: No committed secrets, state or model weights
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(\.env$|\.tfstate$|\.pem$|\.gguf$|\.safetensors$|\.jks$|\.keystore$)'; then
            echo "::error::forbidden file type committed"
            exit 1
          fi
          echo "no forbidden files tracked"

  hetzner-infra:
    name: Hetzner deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        working-directory: infra/hetzner
        env:
          ULTRAN_DOMAIN: api.example.com
          ACME_EMAIL: ops@example.com
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          bash -n backup.sh monitor.sh terraform/provision.sh

      - name: Build production API image
        run: docker build -f ultran-backend/Dockerfile -t ultran-api:ci ultran-backend

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate Hetzner Terraform
        run: |
          terraform -chdir=infra/hetzner/terraform fmt -check -diff -recursive
          terraform -chdir=infra/hetzner/terraform init -backend=false -input=false
          terraform -chdir=infra/hetzner/terraform validate
