name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Python backend is a first-class part of this monorepo and carries the
  # deploy planner, tool sandbox, forge diagnostics and billing ledger. It used
  # to be skipped entirely, which is how a missing module and a schema
  # regression both reached main unnoticed.
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ultran-backend/pyproject.toml

      - name: Install
        working-directory: ultran-backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . pytest httpx

      - name: Import check
        working-directory: ultran-backend
        run: python -c "import ultran_backend; print('import ok')"

      - name: Test
        working-directory: ultran-backend
        run: python -m pytest -q

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11

      # No pnpm-lock.yaml is committed yet, so the install is not frozen and
      # setup-node's pnpm cache is off (it requires a lockfile to key on).
      # Committing a lockfile is tracked as a follow-up; until then this job
      # must not fail on a missing one.
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  structure:
    name: Guard monorepo structure
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The layer boundaries are load-bearing. Fail fast if a top-level
      # workspace directory disappears or is renamed.
      - name: Required directories exist
        run: |
          set -euo pipefail
          required=(
            apps/mobile
            apps/web
            services/api
            services/agent-core
            packages/connectors
            packages/ui
            infra
            docs
          )
          for dir in "${required[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::missing required directory: $dir"
              exit 1
            fi
          done
          echo "all required directories present"

      - name: No committed secrets, state or model weights
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(\.env$|\.tfstate$|\.pem$|\.gguf$|\.safetensors$)'; then
            echo "::error::forbidden file type committed"
            exit 1
          fi
          echo "no forbidden files tracked"
