```yaml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify phone client and connector SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is up to date"
            exit 0
          fi
          git add pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync pnpm lockfile"
          git push origin HEAD:main
      - name: Build connector SDK
        run: pnpm --filter @ultron/connectors build
      - name: Typecheck
        run: pnpm --filter @ultron/phone typecheck
      - name: Lint
        run: pnpm --filter @ultron/phone lint
      - name: Test
        run: pnpm --filter @ultron/phone test && node --test supabase/tests/*.test.mjs
      - name: Build web client
        run: pnpm --filter @ultron/phone build

  backend:
    name: Python control plane tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ultron-backend/pyproject.toml
      - name: Install
        working-directory: ultron-backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio httpx
      - name: Import check
        working-directory: ultron-backend
        run: python -c "import ultron_backend; import ultron_backend.mcp; print('import ok')"
      - name: Test
        working-directory: ultron-backend
        run: python -m pytest -q

  edge-artifact-formats:
    name: Supabase artifact format tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Test native Office artifact packages
        run: deno test --node-modules-dir=auto --allow-net supabase/functions/ultron-product-studio/formats_test.ts

  structure:
    name: Guard active project layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required paths exist
        run: |
          set -euo pipefail
          required=(apps/phone packages/connectors supabase/functions supabase/migrations ultron-backend docs)
          for path in "${required[@]}"; do
            if [ ! -d "$path" ]; then
              echo "::error::missing required path: $path"
              exit 1
            fi
          done
```