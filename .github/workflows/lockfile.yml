name: Lockfile

# pnpm-lock.yaml is a generated file: 12,534 lines / 434 KB. It has to be
# regenerated by pnpm, not hand-edited, so this workflow is where it comes from.
#
# Why this exists at all: without a committed lockfile every CI run re-resolves
# the whole dependency tree, which is how two release runs in a row died on a
# stale registry edge serving rollup 4.67.2. `--frozen-lockfile` in CI and in the
# Android release is only meaningful once this file is on the branch.
#
# Run manually after changing workspace manifests. CI continues to install
# without a lockfile until this workflow has generated and committed one.

on:
  workflow_dispatch:

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh pnpm-lock.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11

      # --lockfile-only resolves the full tree and writes the lockfile without
      # installing; it is an order of magnitude faster and has no side effects on
      # the workspace.
      - name: Resolve the dependency tree
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm install --lockfile-only --no-frozen-lockfile; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          exit 1

      - name: Commit if it changed
        run: |
          set -euo pipefail
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm did not produce a lockfile"
            exit 1
          fi
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "lockfile already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm-lock.yaml from the manifests

Generated by pnpm from the workspace manifests, not edited by hand. This is
what makes installs reproducible and lets CI use --frozen-lockfile."

      - name: Push
        run: git push origin HEAD:main
