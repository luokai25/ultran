name: Build Ultran Termux Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/termux-bootstrap.yml'
      - 'apps/phone/android/termux-upstream/build-ultran-bootstrap.sh'
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated Termux packages to include in the bootstrap
        required: true
        default: git,python
        type: string

permissions:
  contents: write

concurrency:
  group: ultran-termux-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Build prefix-adapted Termux bootstrap archives
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Ultran
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker info

      - name: Build official Termux bootstrap for Ultran
        env:
          ULTRAN_BOOTSTRAP_PACKAGES: ${{ inputs.packages }}
          ULTRAN_BOOTSTRAP_OUTPUT_DIR: ${{ runner.temp }}/ultran-termux-bootstrap
        run: ./apps/phone/android/termux-upstream/build-ultran-bootstrap.sh

      - name: Generate checksums
        working-directory: ${{ runner.temp }}/ultran-termux-bootstrap
        run: sha256sum bootstrap-aarch64.zip bootstrap-x86_64.zip > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultran-termux-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/ultran-termux-bootstrap/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish runtime archives for direct download
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_DIR: ${{ runner.temp }}/ultran-termux-bootstrap
        run: |
          set -euo pipefail
          tag='ultran-termux-runtime-v1'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title 'Ultran Termux Runtime' \
              --notes 'Ultran-specific runtime archives built from pinned official termux/termux-packages source for package app.ultran.mobile and Ultran private storage. Default packages: git and python. SHA256SUMS is included. APT sources are disabled until Ultran has its own compatible package repository.' \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" \
            "$OUTPUT_DIR/bootstrap-aarch64.zip" \
            "$OUTPUT_DIR/bootstrap-x86_64.zip" \
            "$OUTPUT_DIR/SHA256SUMS" \
            --clobber
