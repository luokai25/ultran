name: ULTRON Web Build (Vercel)

on:
  push:
    branches: [main]
    paths:
      - "apps/phone/**"
      - "packages/connectors/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-web-main
  cancel-in-progress: true

jobs:
  build:
    name: Build APK-matched web client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck and build the same client used by Android
        run: pnpm --filter @ultron/phone... build
      - name: Upload deployable web bundle
        uses: actions/upload-artifact@v4
        with:
          name: ultron-apk-matched-web
          path: apps/phone/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Verify the account-free direct chat contract
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const html = await readFile("apps/phone/dist/index.html", "utf8");
          const source = await readFile("apps/phone/src/cloud-llm.ts", "utf8");
          const brain = await readFile("supabase/functions/ultron-brain/index.ts", "utf8");
          if (!html.includes("Message Ultron")) throw new Error("ULTRON composer is missing");
          if (source.includes("getCloudSession()") || source.includes("Sign in with the ULTRON owner account")) {
            throw new Error("Cloud chat still has an account gate");
          }
          if (!source.includes("apikey: ULTRON_SUPABASE_PUBLISHABLE_KEY")) {
            throw new Error("Public chat is missing its publishable project key");
          }
          if (!brain.includes("getInstanceOwnerId")) {
            throw new Error("Cloud brain does not resolve the single ULTRON instance");
          }
          console.log("Account-free ULTRON chat contract passed.");
          NODE
