name: ULTRON Web Build

on:
  push:
    branches: [main]
    paths:
      - "apps/phone/**"
      - "packages/connectors/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ultron-web-main
  cancel-in-progress: true

jobs:
  build:
    name: Build APK-matched web client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck and build the same client used by Android
        run: pnpm --filter @ultron/phone... build
      - name: Upload deployable web bundle
        uses: actions/upload-artifact@v4
        with:
          name: ultron-apk-matched-web
          path: apps/phone/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Publish immutable web assets for the Cloudflare edge
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultron-web-${{ github.sha }}
          name: ULTRON Web ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/phone/dist/index.html
            apps/phone/dist/assets/*
      - name: Smoke-test the live Cloudflare web app and its bundles
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const source = await readFile("apps/phone/dist/index.html", "utf8");
          const paths = [...source.matchAll(/(?:src|href)="([^"]+)"/g)].map(match => new URL(match[1], "https://ultron-app-web.luo-chat-ops.workers.dev/").pathname);
          let response;
          for (let attempt = 0; attempt < 8; attempt++) {
            response = await fetch("https://ultron-app-web.luo-chat-ops.workers.dev/");
            if (response.ok) break;
            await new Promise(resolve => setTimeout(resolve, 2500));
          }
          if (!response?.ok) throw new Error(`Cloudflare app returned HTTP ${response?.status}`);
          const html = await response.text();
          if (!html.includes("ULTRON")) throw new Error("Cloudflare app HTML did not contain the ULTRON shell");
          for (const path of paths) {
            const asset = await fetch(new URL(path, "https://ultron-app-web.luo-chat-ops.workers.dev"));
            if (!asset.ok) throw new Error(`Cloudflare asset ${path} returned HTTP ${asset.status}`);
          }
          console.log(`Cloudflare web smoke test passed: ${paths.length} entry assets, ${html.length} HTML bytes`);
          NODE
