name: ULTRON Web Build

on:
  push:
    branches: [main]
    paths:
      - "apps/phone/**"
      - "packages/connectors/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ultron-web-main
  cancel-in-progress: true

jobs:
  build:
    name: Build APK-matched web client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck and build the same client used by Android
        run: pnpm --filter @ultron/phone... build
      - name: Upload deployable web bundle
        uses: actions/upload-artifact@v4
        with:
          name: ultron-apk-matched-web
          path: apps/phone/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Publish immutable web assets for the Cloudflare edge
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultron-web-latest
          name: ULTRON Web ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/phone/dist/index.html
            apps/phone/dist/assets/*
      - name: Smoke-test the live Cloudflare web app and its bundles
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from "node:fs/promises";
          const localHtml = await readFile("apps/phone/dist/index.html", "utf8");
          const base = "https://ultron-app-web.luo-chat-ops.workers.dev";
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchWithRetry(url, label, readBody) {
            let lastError;
            for (let attempt = 0; attempt < 6; attempt++) {
              try {
                const response = await fetch(url, { signal: AbortSignal.timeout(30_000) });
                if (!response.ok) {
                  await response.body?.cancel();
                  throw new Error(`${label} returned HTTP ${response.status}`);
                }
                const body = await readBody(response);
                return { response, body };
              } catch (error) {
                lastError = error;
                if (attempt < 5) {
                  console.warn(`${label} attempt ${attempt + 1}/6 failed: ${error instanceof Error ? error.message : String(error)}`);
                  await sleep(1500 * (attempt + 1));
                }
              }
            }
            throw new Error(`${label} failed after 6 attempts: ${lastError instanceof Error ? lastError.message : String(lastError)}`);
          }

          const { body: liveHtml } = await fetchWithRetry(
            base + "/", "Cloudflare app", response => response.text()
          );
          if (!liveHtml.includes("ULTRON") || !liveHtml.includes("Message Ultron")) {
            throw new Error("Cloudflare app did not serve the clean APK-matched ULTRON conversation shell");
          }

          const assets = await readdir("apps/phone/dist/assets");
          for (let offset = 0; offset < assets.length; offset += 6) {
            const batch = assets.slice(offset, offset + 6);
            await Promise.all(batch.map(async name => {
              await fetchWithRetry(
                `${base}/assets/${name}`,
                `Cloudflare asset ${name}`,
                async response => {
                  const bytes = await response.arrayBuffer();
                  if (!bytes.byteLength) throw new Error("asset body was empty");
                  return bytes;
                }
              );
            }));
          }
          console.log(`Cloudflare web smoke test passed: ${assets.length} built assets, ${liveHtml.length} HTML bytes; local bundle ${localHtml.length} bytes`);
          NODE
