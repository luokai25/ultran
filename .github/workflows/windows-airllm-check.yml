name: Windows AirLLM bridge check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/airllm-windows/**"
      - "apps/desktop/**"
      - "docs/windows-airllm.md"
      - ".github/workflows/windows-airllm-check.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "tools/airllm-windows/**"
      - "apps/desktop/**"
      - "docs/windows-airllm.md"
      - ".github/workflows/windows-airllm-check.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile bridge syntax
        run: python -m py_compile tools/airllm-windows/server.py
      - name: Check Electron JavaScript syntax
        shell: pwsh
        run: |
          node --check apps/desktop/src/main.cjs
          node --check apps/desktop/src/preload.cjs
          node --check apps/desktop/src/renderer.js
      - name: Parse PowerShell runtime scripts\n        shell: pwsh\n        run: |\n          $files = @("tools/airllm-windows/setup-airllm-runtime.ps1", "tools/airllm-windows/start-ultran-airllm.ps1")\n          foreach ($file in $files) {\n            $tokens = $null\n            $errors = $null\n            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null\n            if ($errors.Count -gt 0) { throw ($file + ": " + ($errors -join "; ")) }\n          }\n      - name: Check launcher and dependency files exist
        shell: pwsh
        run: |
          if (!(Test-Path "tools/airllm-windows/start-ultran-airllm.ps1")) { throw "Launcher missing" }
          if (!(Test-Path "tools/airllm-windows/requirements.txt")) { throw "Requirements missing" }
  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Build portable Windows executable
        run: pnpm --filter @ultran/desktop dist:win
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ultran-windows-desktop
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
