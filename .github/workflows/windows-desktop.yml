name: Ultran Windows Desktop
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "tools/airllm-windows/**"
      - ".github/workflows/windows-desktop.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "tools/airllm-windows/**"
      - ".github/workflows/windows-desktop.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Build portable desktop executable
        run: pnpm --filter @ultran/desktop dist:win
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultran-windows-desktop
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
