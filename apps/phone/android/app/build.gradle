apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Release signing.
//
// The keystore never lives in the repository. Resolution order is:
//   1. -PkeystorePath / -PkeystorePassword / -PkeyAlias / -PkeyPassword
//   2. APP_KEYSTORE_PATH / APP_KEYSTORE_PASSWORD / APP_KEY_ALIAS / APP_KEY_PASSWORD
//   3. android/keystore.properties (git-ignored, for local builds)
//
// The path is resolved against the ANDROID PROJECT dir (rootProject), not app/,
// otherwise it silently resolves to android/app/app-release.keystore and signing
// is skipped without an error.
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def resolveSigning = { String propKey, String envKey, String propsKey, String fallback ->
    def fromProp = project.findProperty(propKey)
    if (fromProp != null && !fromProp.toString().isEmpty()) return fromProp.toString()
    def fromEnv = System.getenv(envKey)
    if (fromEnv != null && !fromEnv.isEmpty()) return fromEnv
    def fromFile = keystoreProps.getProperty(propsKey)
    if (fromFile != null && !fromFile.isEmpty()) return fromFile
    return fallback
}

def ksPath = resolveSigning('keystorePath', 'APP_KEYSTORE_PATH', 'storeFile', 'app-release.keystore')
def ksFile = file(ksPath).isAbsolute() ? file(ksPath) : rootProject.file(ksPath)

def storePasswordValue = resolveSigning('keystorePassword', 'APP_KEYSTORE_PASSWORD', 'storePassword', null)
def keyAliasValue = resolveSigning('keyAlias', 'APP_KEY_ALIAS', 'keyAlias', null)
def keyPasswordValue = resolveSigning('keyPassword', 'APP_KEY_PASSWORD', 'keyPassword', null)

// Sign only when the keystore AND all three credentials are present. Passing a
// null password into the signing config fails the whole build with the opaque
// "Value is null" instead of producing an unsigned APK.
def canSign = ksFile.exists() &&
        storePasswordValue != null && !storePasswordValue.isEmpty() &&
        keyAliasValue != null && !keyAliasValue.isEmpty() &&
        keyPasswordValue != null && !keyPasswordValue.isEmpty()

if (ksFile.exists() && !canSign) {
    logger.warn("Keystore found at ${ksFile} but credentials are incomplete - building UNSIGNED")
}

// Version values are resolved as plain locals before the DSL block. Passing an
// expression straight into `versionCode (...)` is parsed as a method call and
// fails with "Value is null" rather than a useful message.
def appVersionCode = (System.getenv('ULTRAN_VERSION_CODE') ?: '1').toInteger()
def appVersionName = System.getenv('ULTRAN_VERSION_NAME') ?: '0.1.0'

android {
    namespace "app.ultran.mobile"
    compileSdk rootProject.ext.compileSdkVersion

    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "app.ultran.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    signingConfigs {
        release {
            if (canSign) {
                storeFile ksFile
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign when a keystore is present; otherwise emit an unsigned APK so
            // forks and pull requests can still build and inspect the artifact.
            if (canSign) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:2.9.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
