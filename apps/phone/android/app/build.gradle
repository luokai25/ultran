apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Release signing.
//
// The keystore never lives in the repository. Resolution order is:
//   1. -PkeystorePath / -PkeystorePassword / -PkeyAlias / -PkeyPassword
//   2. APP_KEYSTORE_PATH / APP_KEYSTORE_PASSWORD / APP_KEY_ALIAS / APP_KEY_PASSWORD
//   3. android/keystore.properties (git-ignored, for local builds)
//
// The path is resolved against the ANDROID PROJECT dir (rootProject), not app/,
// otherwise it silently resolves to android/app/app-release.keystore and signing
// is skipped without an error.
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def resolveSigning = { String propKey, String envKey, String propsKey, String fallback ->
    def fromProp = project.findProperty(propKey)
    if (fromProp != null && !fromProp.toString().isEmpty()) return fromProp.toString()
    def fromEnv = System.getenv(envKey)
    if (fromEnv != null && !fromEnv.isEmpty()) return fromEnv
    def fromFile = keystoreProps.getProperty(propsKey)
    if (fromFile != null && !fromFile.isEmpty()) return fromFile
    return fallback
}

def ksPath = resolveSigning('keystorePath', 'APP_KEYSTORE_PATH', 'storeFile', 'app-release.keystore')
def ksFile = file(ksPath).isAbsolute() ? file(ksPath) : rootProject.file(ksPath)
def hasKeystore = ksFile.exists()

android {
    namespace "app.ultran.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.ultran.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (System.getenv('ULTRAN_VERSION_CODE') ?: '1').toInteger()
        versionName (System.getenv('ULTRAN_VERSION_NAME') ?: '0.1.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile ksFile
                storePassword resolveSigning('keystorePassword', 'APP_KEYSTORE_PASSWORD', 'storePassword', null)
                keyAlias resolveSigning('keyAlias', 'APP_KEY_ALIAS', 'keyAlias', null)
                keyPassword resolveSigning('keyPassword', 'APP_KEY_PASSWORD', 'keyPassword', null)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign when a keystore is present; otherwise emit an unsigned APK so
            // forks and pull requests can still build and inspect the artifact.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
