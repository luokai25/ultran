apiVersion: v1
kind: Namespace
metadata:
  name: ultron
  labels:
    app.kubernetes.io/part-of: ultron
---
apiVersion: v1
kind: Service
metadata:
  name: ultron-api
  namespace: ultron
  labels:
    app.kubernetes.io/name: ultron-api
    app.kubernetes.io/part-of: ultron
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ultron-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ultron-api
  namespace: ultron
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ultron-api
