# Render Blueprint for Ultran's FastAPI control plane.
# Deploy from the Render dashboard after configuring the required secret values.
services:
  - type: web
    name: ultran-api
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    dockerContext: ./ultran-backend
    dockerfilePath: ./ultran-backend/Dockerfile
    healthCheckPath: /v1/health
    disk:
      name: ultran-api-data
      mountPath: /srv/ultran/.ultran-data
      sizeGB: 1
    envVars:
      - key: ULTRAN_ENV
        value: production
      - key: ULTRAN_DEBUG
        value: "false"
      - key: ULTRAN_DATA_DIR
        value: /srv/ultran/.ultran-data
      - key: ULTRAN_CREDENTIAL_ENCRYPTION_KEY
        sync: false
