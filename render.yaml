# Zero-cost Render Blueprint for Ultron's API prototype.
# Free instances have an ephemeral filesystem: do not store real credentials or rely on local data persisting.
services:
  - type: web
    name: ultron-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    dockerContext: ./ultron-backend
    dockerfilePath: ./ultron-backend/Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: ULTRON_ENV
        value: production
      - key: ULTRON_DEBUG
        value: "false"
      - key: ULTRON_BRAIN_BACKEND
        value: echo
      - key: ULTRON_BRAIN_FALLBACKS
        value: echo
      - key: ULTRON_DATA_DIR
        value: /tmp/ultron-data
      - key: ULTRON_CREDENTIAL_ENCRYPTION_KEY
        sync: false
