[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultran-backend"
version = "0.4.0"
description = "Ultran local-first AI agent workspace - FastAPI control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  # MCP connector runtime (v2). Pinned per the spec's "pin the SDK, wrap it"
  # rule: the SDK surface is resolved in ultran_backend/mcp/transports.py only.
  "mcp>=1.2,<3",
  "jsonschema>=4.20",
  "cryptography>=42.0",
  "composio>=0.22.1,<1.0.0",
  # Maintained document libraries; stdlib fallbacks remain available.
  "reportlab>=4.0",
  "python-pptx>=0.6.23",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["ultran_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
